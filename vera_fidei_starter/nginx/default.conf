# The public host nginx reaches this container through Docker's bridge gateway
# and supplies the real client address. Trust only that exact hop: direct
# callers and other containers cannot forge X-Real-IP for abuse controls.
set_real_ip_from 172.18.0.1;
real_ip_header X-Real-IP;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=vf_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vf_api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=vf_connections:10m;

server {
    listen 80;
    server_name 5.161.115.95;

    server_tokens off;
    proxy_hide_header X-Powered-By;
    client_max_body_size 1g;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://verafidei.oialfred.com; worker-src 'self' blob:; frame-src 'self' blob:; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # PDFs servidos internamente pelo Nginx (X-Accel-Redirect do backend)
    location /protected_pdfs/ {
        internal;
        alias /app/pdfs/;
        types { application/pdf pdf; }
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, max-age=60, must-revalidate" always;
    }

    # PDFs passam primeiro pelo Route Handler do Next.js, que converte a sessão
    # em Bearer. A resposta pode trazer X-Accel-Redirect; nesse caso o próprio
    # Nginx entrega o arquivo montado, com range requests e sem copiar 200MB+
    # por FastAPI e Node.js.
    location ^~ /api/pdfs/ {
        limit_conn vf_connections 20;
        proxy_pass http://frontend:3000/api/pdfs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    # Brute-force and abuse protection for account and contact operations.
    location ~ ^/api/auth/(login|web-login|register|web-register|forgot-password|reset-password|resend-verification|contact)$ {
        limit_req zone=vf_auth_limit burst=5 nodelay;
        limit_conn vf_connections 10;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Compatibilidade com links antigos que usavam /pdfs/{id}.
    location ^~ /pdfs/ {
        proxy_pass http://frontend:3000/api/pdfs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    # Backend API — strips /api prefix before forwarding to FastAPI
    location /api/ {
        limit_req zone=vf_api_limit burst=90 nodelay;
        limit_conn vf_connections 30;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Frontend Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
