services:
  postgres:
    image: postgres:15@sha256:29342cb52157b098821961d2c14eec3c019071f56a5d559e990cf07cf541ea9b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vera_fidei}
      POSTGRES_USER: ${POSTGRES_USER:-vera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env do deploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  elasticsearch:
    image: elasticsearch:8.13.0@sha256:9d1cd1491778aceca4490de7ec9f205c3633a277df15473e1ea507d13a5270c6
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      VERA_ENVIRONMENT: production
      VERA_ENABLE_SEMANTIC_SEARCH: "true"
      VERIFIER_PRELOAD_SEMANTIC: "true"
      VERA_FLAT_SEMANTIC_INDEX: /app/chroma_db/flat_semantic
      VERA_DISABLE_CHROMA_QUERY_FALLBACK: "true"
      VERA_QUERY_EMBEDDING_MODEL: intfloat/multilingual-e5-small
      HF_HOME: /app/model_cache
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/model_cache:/app/model_cache
      - ./backend/pdfs:/app/pdfs
      - ./backend/secrets:/run/secrets/vera-fidei:ro
    depends_on:
      - postgres
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-API-Key: $$API_KEY\" http://localhost:8000/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://verafidei.oialfred.com/api
        NEXT_PUBLIC_API_KEY: ${VERA_PUBLIC_API_KEY:?Defina VERA_PUBLIC_API_KEY no arquivo .env do deploy}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      INTERNAL_API_KEY: ${VERA_PUBLIC_API_KEY:?Defina VERA_PUBLIC_API_KEY no arquivo .env do deploy}
      NEXT_PUBLIC_API_KEY: ${VERA_PUBLIC_API_KEY:?Defina VERA_PUBLIC_API_KEY no arquivo .env do deploy}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/pdfs:/app/pdfs:ro
    networks:
      - default
      - npm_network
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  es_data:

networks:
  default:
  npm_network:
    external: true
    name: nginx-proxy-manager_default
