services:
  nginx:
    ports:
      -  127.0.0.1:8081:80
  backend:
    environment:
      PDF_STORAGE: gdrive
      PDF_CACHE_DIR: /tmp/vera_fidei_pdf_cache
      PDF_CACHE_MAX_GB: 5
      GDRIVE_REMOTE: vera_drive
      GDRIVE_PREFIX: vera-fidei/pdfs
      RCLONE_BIN: rclone
      VERA_RCLONE_TIMEOUT: "900"
      RCLONE_CONFIG: /app/rclone/rclone.conf
    # OAuth refresh rotates rclone.conf atomically, so the isolated runtime
    # directory must be writable. It is excluded from both Git and Docker
    # build contexts and is protected as mode 0700/0600 on the production host.
    volumes:
      - ./backend/rclone:/app/rclone:rw
